<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移動中… | sys.azuk1.com</title>
<meta name="robots" content="noindex">
<!-- JSが無効な環境向けのフォールバック(トップへ移動) -->
<noscript><meta http-equiv="refresh" content="0;url=https://sys.azuk1.com/"></noscript>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f5f6fa; color: #1c1e26;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14151a; color: #e8e9ef; }
  }
  .card { text-align: center; padding: 32px 28px; max-width: 90%; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 18px;
    border: 4px solid rgba(128,128,128,.25); border-top-color: #4f7cff;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 4px 0; font-size: 14px; opacity: .75; word-break: break-all; }
  a { color: #4f7cff; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>新しいURLへ移動しています…</h1>
    <p id="dest">https://sys.azuk1.com/</p>
    <p><a id="link" href="https://sys.azuk1.com/">自動で移動しない場合はこちら</a></p>
  </div>

<script>
(function () {
  var TARGET_HOST = "sys.azuk1.com";

  // 今アクセスしているURLのパス・クエリ・ハッシュをそのまま引き継ぐ
  var loc = window.location;
  var url = "https://" + TARGET_HOST + loc.pathname + loc.search + loc.hash;

  // 画面表示を更新
  document.getElementById("dest").textContent = url;
  document.getElementById("link").href = url;

  // すでに移動先ドメインにいる場合は無限ループ防止のため何もしない
  if (loc.hostname === TARGET_HOST) return;

  // 履歴を汚さずにリダイレクト
  loc.replace(url);
})();
</script>
</body>
</html>
